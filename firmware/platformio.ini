; ROOTKIT — firmware para las placas.
;
;   pio run -e c3-22           compilar ESP32-C3 SuperMini + TFT 2,2"
;   pio run -e c3-22 -t upload flashear
;   pio device monitor         ver el log
;
; El núcleo (core/, gfx/, art/, ui/, net/, nodo/) es el mismo que se prueba en
; el escritorio con `make test`. Acá se le suma esp32/, que es sólo hardware.
; Ver docs/firmware.md.

[platformio]
src_dir = .
default_envs = c3-22

[env]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Dos particiones de app de 1,9 MB: deja lugar para actualizar por aire (OTA)
; y 190 KB de LittleFS, que al historial le sobran.
board_build.partitions = min_spiffs.csv
build_src_filter =
    -<*>
    +<core/>
    +<gfx/>
    +<art/>
    +<ui/>
    +<net/>
    +<nodo/>
    +<third_party/>
    +<esp32/>
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
build_flags =
    -DRK_FW_VERSION=\"0.5.0\"
    ; Servidor de la nube: la versión de prueba en el VPS, con HTTPS, así el
    ; QR abre una app que se instala y avisa. Para usar root-lab en la PC,
    ; poner su IP en la red de la casa (por ejemplo http://192.168.0.10:8080).
    ; También se puede cambiar desde el portal, en "Avanzado".
    -DRK_NUBE_URL=\"https://ifbotech.com/rootkit\"
    ; Base del QR, si tiene que ser otra (por ejemplo un túnel HTTPS para
    ; probar instalación y notificaciones en el teléfono). Vacía = la nube.
    -DRK_APP_URL=\"\"
    -Wno-unused-function

; ---------------------------------------------------------------- C3 SuperMini
[c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
    ${env.build_flags}
    -DRK_PLACA_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3-22]
board = ${c3.board}
board_build.flash_mode = ${c3.board_build.flash_mode}
build_flags = ${c3.build_flags} -DRK_PANEL_ILI9341_240

[env:c3-144]
board = ${c3.board}
board_build.flash_mode = ${c3.board_build.flash_mode}
build_flags = ${c3.build_flags} -DRK_PANEL_ST7735_128 -DRK_TFT_OFS_X=2 -DRK_TFT_OFS_Y=1

; --------------------------------------------------------- ESP32 DevKit 30 pines
[devkit]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DRK_PLACA_DEVKIT

[env:devkit-22]
board = ${devkit.board}
build_flags = ${devkit.build_flags} -DRK_PANEL_ILI9341_240

[env:devkit-144]
board = ${devkit.board}
build_flags = ${devkit.build_flags} -DRK_PANEL_ST7735_128 -DRK_TFT_OFS_X=2 -DRK_TFT_OFS_Y=1
