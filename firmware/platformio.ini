; ROOTKIT — firmware para las placas.
;
;   pio run -e c3-144           compilar ESP32-C3 SuperMini + TFT 1,44" (el producto)
;   pio run -e c3-144 -t upload flashear
;   pio run -e devkit-144       el banco de pruebas (ESP32 DevKit)
;   pio device monitor         ver el log
;
; El núcleo (core/, gfx/, art/, ui/, net/, nodo/) es el mismo que se prueba en
; el escritorio con `make test`. Acá se le suma esp32/, que es sólo hardware.
; Ver docs/firmware.md.

[platformio]
src_dir = .
default_envs = c3-144

[env]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Dos particiones de app de 1,9 MB: deja lugar para actualizar por aire (OTA)
; y 190 KB de LittleFS, que al historial le sobran.
board_build.partitions = min_spiffs.csv
build_src_filter =
    -<*>
    +<core/>
    +<gfx/>
    +<art/>
    +<ui/>
    +<net/>
    +<nodo/>
    +<third_party/>
    +<esp32/>
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
build_flags =
    -DRK_FW_VERSION=\"0.6.1\"
    ; Servidor de la nube, con HTTPS. En el PRODUCTO (c3-144) es fija: el
    ; aparato no le manda su token a ninguna otra, y nunca por HTTP plano.
    ; Para usar root-lab en la PC (http://192.168.0.10:8080) hace falta una
    ; placa de banco: devkit-144, o c3-144 con -DRK_BANCO=1, que además
    ; habilita elegir el servidor en el portal ("Avanzado"). Ver
    ; docs/firmware.md, "El banco y el producto".
    -DRK_NUBE_URL=\"https://ifbotech.com/rootkit\"
    ; Base del QR, si tiene que ser otra (por ejemplo un túnel HTTPS para
    ; probar instalación y notificaciones en el teléfono). Vacía = la nube.
    -DRK_APP_URL=\"\"
    -Wno-unused-function
    ; Ajustes del panel y de su luz de fondo que dependen del modulo que
    ; llegue, no del codigo (ver docs/pcb.md):
    ;   -DRK_TFT_BL_INVERTIDO=1   si el pin BL del modulo es activo en bajo
    ;   -DRK_TFT_SPI_HZ=20000000  si a 40 MHz la imagen sale con basura

; ---------------------------------------------------------------- C3 SuperMini
[c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
    ${env.build_flags}
    -DRK_PLACA_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3-144]
board = ${c3.board}
board_build.flash_mode = ${c3.board_build.flash_mode}
build_flags = ${c3.build_flags} -DRK_PANEL_ST7735_128 -DRK_TFT_OFS_X=2 -DRK_TFT_OFS_Y=1

; --------------------------------------------------------- ESP32 DevKit 30 pines
[devkit]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DRK_PLACA_DEVKIT
    ; El banco de pruebas: la nube se puede cambiar y puede ser http://.
    -DRK_BANCO=1

[env:devkit-144]
board = ${devkit.board}
build_flags = ${devkit.build_flags} -DRK_PANEL_ST7735_128 -DRK_TFT_OFS_X=2 -DRK_TFT_OFS_Y=1
