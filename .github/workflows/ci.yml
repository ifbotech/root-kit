name: pruebas

on:
  push:
    branches: [main]
  pull_request:

# El token de GitHub sólo lee: ningún paso de las pruebas escribe en el repo.
permissions:
  contents: read

jobs:
  nucleo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        # SDL2 sólo para el simulador interactivo; clang y lld para el
        # renderer en WebAssembly. Las pruebas no necesitan ninguno.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev clang lld

      - name: Compilar sin warnings y probar
        # -Werror sólo en CI: en desarrollo un warning no debe frenar una
        # prueba rápida, pero nada llega a main con advertencias.
        run: make -C firmware CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -Werror -O2" test

      - name: El sustrato impreso está en regla y sus generados al día
        # La geometría de la PCB de cinta de cobre (separaciones, anchos,
        # conectividad, zona libre de la antena) se verifica sola, y los
        # archivos que salen del dato tienen que estar commiteados: si no,
        # la plantilla que se imprime y la netlist que mira `make test`
        # dejan de describir la placa que se arma.
        run: |
          python3 tools/pcb.py --generar
          if [ -n "$(git status --porcelain firmware/test/redes.h docs/conexiones.md hardware/pcb/generado)" ]; then
            echo "Hay que correr 'make pcb' y commitear:"
            git --no-pager diff --stat firmware/test/redes.h docs/conexiones.md hardware/pcb/generado
            exit 1
          fi

      - name: Las referencias visuales están al día
        run: |
          make -C firmware golden
          if [ -n "$(git status --porcelain firmware/test/golden.h)" ]; then
            echo "Hay que regenerar y commitear:"
            git --no-pager diff --stat firmware/test/golden.h
            exit 1
          fi

      - name: El simulador compila y captura
        run: |
          make -C firmware build/rootkit_sim
          ./firmware/build/rootkit_sim --sheet     /tmp/sheet.bmp
          ./firmware/build/rootkit_sim --etapas    /tmp/etapas.bmp
          ./firmware/build/rootkit_sim --despertar /tmp/despertar.bmp
          ./firmware/build/rootkit_sim --pantallas /tmp/pantallas.bmp
          ./firmware/build/rootkit_sim --bench

      - name: El renderer compila a WebAssembly
        run: make -C firmware wasm

      - name: La estación de fábrica deriva el mismo token que el firmware
        run: python3 tools/fabrica.py --autoprueba

      - name: Ningún flujo usa secretos
        # La clave privada del firmware no va a GitHub: firmar en un runner es
        # exponerla a todo lo que corre ahí (pip, PlatformIO, sus toolchains,
        # las pruebas del repo). Se firma en la computadora de quien publica
        # (docs/ota.md). Si algún día un flujo necesita un secreto, esto hay
        # que pensarlo de nuevo, no borrarlo.
        run: |
          if grep -rnE 'secrets[.]' .github/workflows/; then
            echo "Un flujo usa secretos: ver docs/ota.md, 'Quién firma'."
            exit 1
          fi

  placas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        entorno: [c3-144, devkit-144]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Compilar ${{ matrix.entorno }}
        run: cd firmware && pio run -e ${{ matrix.entorno }}
      # El binario queda como artefacto del commit, con su SHA-256: es el que
      # se firma y se publica para los aparatos (docs/ota.md). Publicar NO es
      # automático ni pasa por GitHub: lo hace una persona con la clave
      # privada, en su máquina.
      - name: Huella del binario
        run: cd firmware/.pio/build/${{ matrix.entorno }} && sha256sum firmware.bin | tee firmware.bin.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.entorno }}
          path: |
            firmware/.pio/build/${{ matrix.entorno }}/firmware.bin
            firmware/.pio/build/${{ matrix.entorno }}/firmware.bin.sha256
          retention-days: 30

