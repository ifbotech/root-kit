<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + los safe-area-inset del CSS: sin eso, a pantalla
     completa en un iPhone la barra de pestañas queda debajo del indicador
     de inicio y no se puede tocar. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1512">
<meta name="description" content="Cuidá tus plantas con los datos que manda el ROOTKIT clavado en la maceta.">
<title>ROOTKIT</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">

<!-- iOS ignora el manifest para esto: necesita sus propias etiquetas o la
     app abre dentro de Safari con la barra de direcciones puesta. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROOTKIT">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="icon" href="iconos/icono-192.png" sizes="192x192">
</head>
<body>

<div id="instalar" class="instalar" hidden></div>

<header class="barra">
  <h1>ROOT<span>KIT</span></h1>
  <p id="sinred" class="sinred" hidden>sin conexión con tus plantas</p>
</header>

<main id="vista" class="contenido"></main>

<p id="aviso" class="aviso" role="status" aria-live="polite" hidden></p>

<nav class="tabs" role="tablist" aria-label="Secciones">
  <button role="tab" class="tab activa" data-vista="hoy" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 a9 9 0 1 0 0 18 a9 9 0 0 0 0-18 Z M12 7 v5 l3 2"/></svg>
    <span>Hoy</span>
    <b id="globo-hoy" class="globo" hidden></b>
  </button>
  <button role="tab" class="tab" data-vista="plantas" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4 C20 4 6 3 6 13 a6 6 0 0 0 12 0 C18 8 12 8 9 16 M4 20 L9 16"/></svg>
    <span>Plantas</span>
  </button>
  <button role="tab" class="tab" data-vista="escaner" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7 h4 l2-2 h6 l2 2 h4 v12 H3 Z M12 16 a3.5 3.5 0 1 0 0-7 a3.5 3.5 0 0 0 0 7 Z"/></svg>
    <span>Escanear</span>
  </button>
  <button role="tab" class="tab" data-vista="coleccion" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7 L12 3 L21 7 v10 L12 21 L3 17 Z M3 7 L12 11 L21 7 M12 11 v10"/></svg>
    <span>Colección</span>
  </button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
